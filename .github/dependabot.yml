# Monthly, grouped minor and patch updates. Major versions are upgraded deliberately
# (for example TypeScript, which typescript-eslint must support first, and @types/node,
# which tracks the Node.js LTS used in CI). Security updates arrive as they are published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [release]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    labels: [core]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [ui]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
