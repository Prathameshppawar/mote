name: Build installers

# Builds macOS (Apple Silicon + Intel) and Windows installers.
# Runs on demand, and is reused by the release workflow to attach
# installers to a draft GitHub Release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-id:
        description: Draft release to upload installers to (empty = workflow artifacts only)
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            runner: macos-latest
            target: x86_64-apple-darwin
          - label: Windows (x64)
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Signing. Mote is signed with its own self-signed certificate, so its
      # identity stays the same across updates and macOS keeps the Accessibility
      # permission (ADR 0008). Tauri's APPLE_CERTIFICATE import only accepts
      # Apple-issued certificates, so the certificate is imported here into a
      # temporary keychain and Tauri gets just APPLE_SIGNING_IDENTITY. codesign
      # only uses identities trusted for code signing, so the public certificate
      # is trusted too. Without these secrets the app is ad hoc signed
      # (signingIdentity "-" in tauri.conf.json).
      - name: Import the code signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE" ] || [ -z "$SIGNING_IDENTITY" ]; then
            echo "No signing certificate configured: the app will be ad hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/mote-signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # one argument per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain apps/desktop/src-tauri/signing/mote-code-signing.crt
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$SIGNING_IDENTITY\""; then
            security find-identity -p codesigning "$keychain"
            echo "::error::\"$SIGNING_IDENTITY\" is not a valid code signing identity on this runner"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      # Optional notarization, for a Developer ID certificate. Unset secrets
      # expand to empty strings, which the bundler would treat as set, so only
      # non-empty values are exported.
      - name: Configure optional notarization
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          configured=0
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
              configured=$((configured + 1))
            fi
          done
          echo "Notarization variables configured: $configured of 3"
      - name: Build and bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs update bundles; the app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          releaseId: ${{ inputs.release-id }}
          # The release workflow writes one manifest for all platforms.
          uploadUpdaterJson: false
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mote-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            target/${{ matrix.target }}/release/bundle/msi/*.msi*
