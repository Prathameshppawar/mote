name: Release

# Push a tag like v1.0.0 to publish a release:
#   1. verify versions, changelog and release notes match the tag
#   2. create a draft GitHub Release from docs/releases/<tag>.md
#   3. build and attach macOS (arm64, x64) and Windows (x64) installers
#   4. attach SHA256SUMS.txt and add the checksums to the release notes
#   5. publish the release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-version.mjs --tag "${GITHUB_REF_NAME}"

  draft:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Mote ${TAG}" --notes-file "docs/releases/${TAG}.md"
          fi
          echo "release-id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build installers
    needs: draft
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ needs.draft.outputs.release-id }}
    secrets: inherit

  checksums:
    name: Checksums and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "${GITHUB_REF_NAME}" --dir assets
          ls -la assets
      - name: Compute SHA-256 checksums
        run: |
          cd assets
          rm -f SHA256SUMS.txt
          sha256sum -- * | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Attach checksums and update notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          {
            cat "docs/releases/${TAG}.md"
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
