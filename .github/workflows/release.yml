name: Release

# Push a tag like v1.0.0 to publish a release:
#   1. verify versions, changelog and release notes match the tag
#   2. create a draft GitHub Release from docs/releases/<tag>.md
#   3. build and attach macOS (arm64, x64) and Windows (x64) installers
#   4. attach SHA256SUMS.txt and add the checksums to the release notes
#   5. publish the release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-version.mjs --tag "${GITHUB_REF_NAME}"

  draft:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Reuse the draft from an earlier run of this tag (re-runs, a re-pushed tag);
          # otherwise create it. Any API failure stops the job instead of creating
          # a duplicate draft or building without a release to upload to.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "map(select(.tag_name == \"${TAG}\")) | first | .id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" -f name="Mote ${TAG}" -F draft=true \
              -F body=@"docs/releases/${TAG}.md" --jq .id)
          fi
          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not find or create a draft release for ${TAG}"
            exit 1
          fi
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build installers
    needs: draft
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ needs.draft.outputs.release-id }}
    secrets: inherit

  checksums:
    name: Checksums and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "${GITHUB_REF_NAME}" --dir assets
          ls -la assets
      - name: Write the update manifest
        run: |
          set -euo pipefail
          node scripts/update-manifest.mjs --dir assets --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > assets/latest.json
          cat assets/latest.json
      - name: Compute SHA-256 checksums
        run: |
          set -euo pipefail
          cd assets
          rm -f SHA256SUMS.txt
          sha256sum -- * | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Attach checksums and update notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" assets/latest.json SHA256SUMS.txt --clobber
          {
            cat "docs/releases/${TAG}.md"
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
