[workspace]
resolver = "2"
members = [
    "crates/mote-core",
    "crates/mote-providers",
    "crates/mote-storage",
    "crates/mote-platform",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
authors = ["Prathamesh Pawar"]
repository = "https://github.com/Prathameshppawar/mote"
homepage = "https://github.com/Prathameshppawar/mote"

[workspace.dependencies]
mote-core = { path = "crates/mote-core", version = "1.0.0" }
mote-providers = { path = "crates/mote-providers", version = "1.0.0" }
mote-storage = { path = "crates/mote-storage", version = "1.0.0" }
mote-platform = { path = "crates/mote-platform", version = "1.0.0" }

async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
futures = "0.3.31"
parking_lot = "0.12.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2", "charset", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
url = "2.5.8"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7.17"
tracing = "0.1.41"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "chrono-impl"] }
unicode-segmentation = "1.12.0"

# Test-only
tempfile = "3.23.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 1
